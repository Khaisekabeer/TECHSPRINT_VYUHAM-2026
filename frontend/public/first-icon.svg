  <circle cx="32" cy="28" r="18.5" fill="url(#goldCore)" stroke="#FDE68A" stroke-width="1"/>
  <circle cx="32" cy="28" r="16.5" stroke="#F59E0B" stroke-dasharray="2.5 1.5" stroke-width="0.8" fill="none"/>

